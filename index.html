let wineSearch="", wineFilter="Все",wineOpen=new Set();
function btn(txt,fn,css=''){return `<button class="${css}" data-action="${fn}">${txt}</button>`}
function setView(v,c='',cat=''){view=v;current=c;category=cat;search='';expanded.clear();render();scrollTo(0,0)}
function getCategories(s){const cats=[...new Set(ITEMS.filter(i=>i.section===s).map(i=>i.category))];return s==='Напитки'?['Алкоголь','Лимонады','Чай','Кофе'].filter(c=>cats.includes(c)):cats}
function header(){return `<header><div class="top"><button data-action="home">⌂</button><div class="brand"><span class="smallcaps">Помощник официанта</span><strong>ЗЕЛЕНОЕ ОЗЕРО</strong></div><span style="color:#b8a880">✦</span></div></header>`}
function home(){return `<div class="hero"><img src="${LOGO}" alt="Логотип Зеленое озеро"><div class="smallcaps">Загородный клуб · ресторан · пляж</div><h1>ЗЕЛЕНОЕ ОЗЕРО</h1><div class="line"></div><p>ПОМОЩНИК ОФИЦИАНТА</p></div><h2 class="sectionTitle">Разделы меню</h2><div class="tiles">${btn('<span>♨</span><b>Кухня</b><small>Блюда, составы и цены</small><i class="arrow">↗</i>','section:Кухня','tile')}${btn('<span>♧</span><b>Детское меню</b><small>Горячее, гарниры, сладкое</small><i class="arrow">↗</i>','section:Детское меню','tile')}${btn('<span>♢</span><b>Бар</b><small>Коктейли, вина и напитки</small><i class="arrow">↗</i>','bar','tile wide')}</div><p class="copyright">✦ ЗЕЛЕНОЕ ОЗЕРО ✦</p>`}
function bar(){return `<div class="crumb">Главная / Бар</div><h1 class="sectionTitle">Бар</h1><p class="sub">Выбери нужную карту.</p><div class="tiles">${btn('<span>♧</span><b>Коктейльная карта</b><small>Коктейли и моктейли</small>','section:Коктейльная карта','tile')}${btn('<span>♢</span><b>Винная карта</b><small>Каталог вин, вкусы и гастропары</small>','wine','tile')}${btn('<span>☕</span><b>Напитки</b><small>Алкоголь, лимонады, чай, кофе</small>','section:Напитки','tile wide')}</div>`}
function section(){let cats=getCategories(current);return `<div class="crumb">Главная / ${escapeHTML(current)}</div><h1 class="sectionTitle">${escapeHTML(current)}</h1><p class="sub">Выбери категорию или найди позицию по названию и ингредиентам.</p><div class="search"><span>⌕</span><input id="search" placeholder="Поиск по всему разделу…" value="${escapeHTML(search)}"></div>${search?entryList(ITEMS.filter(i=>i.section===current&&match(i)),false):`<div class="categorygrid">${cats.map(c=>btn(`<strong>${escapeHTML(c)}</strong><small>${ITEMS.filter(i=>i.section===current&&i.category===c).length} поз.</small>`,'category:'+encodeURIComponent(c),'cat')).join('')}</div>`}`}
function match(i){let s=search.toLocaleLowerCase('ru');return (i.name+' '+i.description+' '+i.category).toLocaleLowerCase('ru').includes(s)}
function entryList(arr,showName=true){return `<p class="count">${arr.length} позиций</p><div class="entries">${arr.length?arr.map(i=>{let id=ITEMS.indexOf(i),on=expanded.has(id);return `<article class="entry ${on?'is-open':''}"><button data-action="expand:${id}" aria-expanded="${on}" aria-controls="detail-${id}"><span class="name">${escapeHTML(i.name)}</span>${i.price?`<span class="price">${escapeHTML(i.price)} ₽</span>`:''}<span class="entry-toggle" aria-hidden="true">＋</span></button><div class="accordion" id="detail-${id}" aria-hidden="${!on}"><div class="accordion-inner"><div class="description">${i.subcategory&&i.section==='Напитки'?`<div class="subtype">${escapeHTML(i.subcategory.replace(/^Алкоголь · /,'').replace('Чай и фруктовый чай','Чай').replace('Безалкогольные напитки','Другие безалкогольные напитки'))}</div>`:''}${i.description?escapeHTML(i.description):'<span class="tag">Уточнить состав</span>'}${i.sauce?`<div class="note"><strong>Соусы:</strong> ${escapeHTML(i.sauce)}</div>`:''}${i.allergens?`<div class="note"><strong>Потенциальные аллергены:</strong> ${escapeHTML(i.allergens)} <small>Проверить с кухней перед ответом гостю.</small></div>`:''}${i.category==='Паста-конструктор'?`<div class="note">Паста + основа + соус на выбор. Цена общая — 810 ₽.</div>`:''}</div></div></div></article>`}).join(''):'<div class="empty">Ничего не найдено</div>'}</div>`}
function categoryView(){let filtered=ITEMS.filter(i=>i.section===current&&i.category===category&&match(i));return `<div class="crumb">Главная / ${escapeHTML(current)} / ${escapeHTML(category)}</div>${btn('← Ко всем категориям','section:'+current,'back')}<h1 class="sectionTitle">${escapeHTML(category)}</h1><div class="search"><span>⌕</span><input id="search" placeholder="Найти позицию или ингредиент…" value="${escapeHTML(search)}"></div>${entryList(filtered)}`}
function wine(){
 const categories=['Все',...new Set(WINE_CATALOG.map(x=>x.category))];
 const q=wineSearch.trim().toLocaleLowerCase('ru');
 const wines=WINE_CATALOG.map((x,i)=>({...x,id:i})).filter(x=>(wineFilter==='Все'||x.category===wineFilter)&&(!q||(x.name+' '+x.country+' '+x.category+' '+x.taste+' '+x.pair).toLocaleLowerCase('ru').includes(q)));
 return `<div class="crumb">Главная / Бар / Винная карта</div><h1 class="sectionTitle">Винная карта</h1>
 <p class="sub">Интерактивные карточки вин, вкусовые ориентиры и сочетания с блюдами.</p>
 <div class="note">Описания вкуса и сочетаний — ориентировочные рекомендации по сорту или региону, не дегустационные заметки производителя. Проверяй точный стиль и наличие по бутылке. Каталог ещё сверяется с печатной картой.</div>
 <div class="search"><span>⌕</span><input id="wineSearch" placeholder="Название, страна, сорт, блюдо…" value="${escapeHTML(wineSearch)}"></div>
 <div class="chiprow">${categories.map(c=>`<button class="chip ${wineFilter===c?'selected':''}" data-action="winefilter:${encodeURIComponent(c)}">${escapeHTML(c)}</button>`).join('')}</div>
 <p class="count">${wines.length} вин в каталоге · 150 или 750 мл</p><div class="entries">${wines.map(x=>`<article class="entry ${wineOpen.has(x.id)?'is-open':''}"><button data-action="wineexpand:${x.id}" aria-expanded="${wineOpen.has(x.id)}"><span class="name">${escapeHTML(x.name)}<small style="display:block;font-weight:400;color:#64736f">${escapeHTML(x.country)} · ${escapeHTML(x.volume)}</small></span><span class="price">${escapeHTML(x.price)} ₽</span><span class="entry-toggle">＋</span></button><div class="accordion"><div class="accordion-inner"><div class="description"><strong>Вкус и аромат:</strong> ${escapeHTML(x.taste||'Уточнить описание')}<br><strong>С чем предложить:</strong> ${escapeHTML(x.pair||'Уточнить сочетание')}<div class="hint">Рекомендация ориентировочная. Информация из меню: название, страна, цена и объём.</div></div></div></div></article>`).join('')}</div>
 `;
}
function render(focus=false){APP.innerHTML=header()+`<main class="wrap">${view==='home'?home():view==='bar'?bar():view==='wine'?wine():view==='section'?section():categoryView()}</main>`;let wi=document.getElementById('wineSearch');if(wi){wi.addEventListener('input',e=>{wineSearch=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('wineSearch');n.focus();n.setSelectionRange(pos,pos)})}let input=document.getElementById('search');if(input){input.addEventListener('input',e=>{const caret=e.target.selectionStart;search=e.target.value;render(true);let n=document.getElementById('search');n.focus();n.setSelectionRange(caret,caret)});if(focus)input.focus({preventScroll:true})}}
function toggleEntry(id){const el=document.querySelector(`[data-action="expand:${id}"]`);if(!el)return;const article=el.closest('.entry');const detail=article.querySelector('.accordion');const open=!expanded.has(id);if(open)expanded.add(id);else expanded.delete(id);article.classList.toggle('is-open',open);el.setAttribute('aria-expanded',String(open));detail.setAttribute('aria-hidden',String(!open));}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='home')setView('home');else if(a==='bar')setView('bar');else if(a==='wine')setView('wine');else if(a.startsWith('section:'))setView('section',a.slice(8));else if(a.startsWith('category:'))setView('category',current,decodeURIComponent(a.slice(9)));else if(a.startsWith('expand:')){let id=Number(a.slice(7));toggleEntry(id)}else if(a.startsWith('winefilter:')){wineFilter=decodeURIComponent(a.slice(11));wineOpen.clear();render()}else if(a.startsWith('wineexpand:')){let id=Number(a.slice(11));wineOpen.has(id)?wineOpen.delete(id):wineOpen.add(id);let card=el.closest('.entry');card.classList.toggle('is-open',wineOpen.has(id));el.setAttribute('aria-expanded',String(wineOpen.has(id)))}else if(a.startsWith('zoom:')){document.getElementById('bigpic').src=WINE[Number(a.slice(5))].image;document.getElementById('viewer').style.display='block'}});render();
